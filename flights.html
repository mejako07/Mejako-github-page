<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flights - Four Seasons Travel Agency</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header class="topbar">
        <div class="topbar-inner">
            <div class="logo">LOGO</div>
            <nav class="nav-items">
                <a href="index.html" class="nav-link">Home</a>
                <a href="about.html" class="nav-link">About</a>
                <a href="flights.html" class="nav-link">Flights</a>
                <a href="lodges.html" class="nav-link">Lodges</a>
                <a href="photogalleries.html" class="nav-link">Gallery</a>
                <a href="contact.html" class="nav-link">Contact</a>
            </nav>
        </div>
    </header>

    <main>
        <!-- Top 3-column image grid -->
        <section class="flights-grid-top">
            <div class="flight-img">
                <img src="images/ROute-768x530.jpg.webp" alt="Flight route 1">
            </div>
            <div class="flight-img">
                <img src="images/Johannesburg-to-Harare-flight.jpg" alt="Flight route 2">
            </div>
            <div class="flight-img">
                <img src="images/ROute-768x530.jpg.webp" alt="Flight route 3">
            </div>
        </section>

        <!-- Bottom row: search box (left) + 2 images (right) -->
        <section class="flights-grid-bottom">
            <div class="search-box">
                <h5>Search Flights</h5>
                <form action="#" method="get">
                    <div style="margin-bottom: 12px;">
                        <label for="from" class="form-label">From</label>
                        <input type="text" class="form-control" id="from" placeholder="Departure city">
                    </div>
                    <div style="margin-bottom: 12px;">
                        <label for="to" class="form-label">To</label>
                        <input type="text" class="form-control" id="to" placeholder="Destination">
                    </div>
                    <div style="margin-bottom: 12px;">
                        <label for="date" class="form-label">Date</label>
                        <input type="text" class="form-control" id="date" placeholder="dd/mm/yyyy">
                    </div>
                    <div style="margin-bottom: 12px;">
                        <label for="passengers" class="form-label">Passengers</label>
                        <input type="number" class="form-control" id="passengers" placeholder="Number of passengers" min="1">
                    </div>
                    <button type="submit" class="btn btn-primary" style="width: 100%; padding: 8px;">Search</button>
                </form>
            </div>
            <div class="flight-img-bottom">
                <img src="images/Johannesburg-to-Harare-flight.jpg" alt="Flight option 1">
            </div>
            <div class="flight-img-bottom">
                <img src="images/ROute-768x530.jpg.webp" alt="Flight option 2">
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="footer-inner">&copy; 2026 Four Seasons Travel Agency. All rights reserved.</div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.min.js"></script>
</body>
</html>
